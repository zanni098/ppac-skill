<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="PPAC: Post-Production App Check">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="80" y="96" width="8" height="150" rx="4" fill="url(#accent)"/>
  <text x="112" y="200" font-family="Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#f0f6fc" letter-spacing="4">PPAC</text>
  <text x="112" y="250" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#8b949e" letter-spacing="2">POST-PRODUCTION APP CHECK</text>
  <text x="80" y="340" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="600" fill="#f0f6fc">Audit your app before you ship it.</text>
  <text x="80" y="392" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#8b949e">A Claude skill. Evidence for every check. A clear ship / don't-ship verdict.</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
    <rect x="80" y="450" width="330" height="64" rx="32" fill="#2d1216" stroke="#f85149" stroke-width="2"/>
    <text x="245" y="491" text-anchor="middle" fill="#ff7b72">Tier 1 · Blockers</text>
    <rect x="430" y="450" width="420" height="64" rx="32" fill="#2b2110" stroke="#d29922" stroke-width="2"/>
    <text x="640" y="491" text-anchor="middle" fill="#e3b341">Tier 2 · Before real users</text>
    <rect x="870" y="450" width="330" height="64" rx="32" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/>
    <text x="1035" y="491" text-anchor="middle" fill="#56d364">Tier 3 · Scale later</text>
  </g>

  <text x="80" y="584" font-family="Menlo, Consolas, monospace" font-size="26" fill="#58a6ff">github.com/zanni098/ppac-skill</text>
</svg>
